# ============================================================================
# ENGE Configuration File
# ============================================================================
# This is the user configuration for enge. Copy this file to one of:
# The file paths are ordered by the config parsing priority.
#   - ~/.config/enge.toml (recommended)
#   - ~/enge.toml
#   - ./enge.toml (project-specific)
#
# All settings marked 'REQUIRED' must be configured for enge to work.
# All other settings have sensible defaults.
# ============================================================================

# ============================================================================
# COMMON (Global paths and storage locations)
# - Controls where enge stores job IDs, archives, and downloaded logs
# - Overrides default_config.toml post install script
# - INFO: The default paths are defined in the default_config.toml, use this section to override.
# ============================================================================
[common]
# Path for temporary latest jobs file
# Default: /tmp/enge_latest_jobs
archive_tasks_latest = ''

# Directory for archived job files
# Default: ~/.enge/jobs_archive/
archive_tasks_default = ''

# Directory for downloaded log files
# Default: /var/tmp/enge/logs/
logs_directory = ''

# Override default:
# Default: '#!/bin/sh\\nsudo sed -i s/.*ssh-rsa/ssh-rsa/ /root/.ssh/authorized_keys'
post_install_script = ''


# ============================================================================
# TESTING_FARM (Credentials and cost tags)
# - API key and business unit tag required to submit jobs
# - INFO: Default cloud_resources_tag defined in the default_config.toml, override here
# ============================================================================
[testing_farm]
# REQUIRED: Testing Farm API access token
# Get yours at: https://docs.testing-farm.io/Testing%20Farm/0.1/onboarding.html#_api_version_v0_1
# Priority: config value > TESTING_FARM_API_TOKEN environment variable
api_key = ''

# Override default cloud resources business unit tag for cost tracking
cloud_resources_tag = ''


# ============================================================================
# TESTS (Test suite source and execution scope)
# - Where tests live and how to fan out plans/architectures
# - INFO: git_url/git_ref/parallel_limit come from defaults, override here or with --git-url/--git-ref/--parallel-limit
# ============================================================================
[tests]
# URL to tests metadata repository
# Leave empty to use the default config value
git_url = ''

# Git ref (branch/tag/commit) to checkout test suite from
# Default: main
git_ref = ''

# List of architectures for testing
architectures = []

# Maximum number of plans to run in parallel
# Default: 12
parallel_limit = ''

# List of test plans to execute
# Can be overridden via command line
# Populates the 'name' field in the request, refers to plan name
# Can be specified as a regex: plans = ["Basic$"] -> runs TestBasic (not TestBasicRHSM, TestBasicOvlLegacy, etc.)
# Example: plans = ['/plans/basic', '/plans/integration']
plans = []

# Source compose to be upgraded.
# Can be provided in a format of <major>.<minor> (e.g. 8.10) or explicit compose name (e.g. RHEL-8.10.0-Nightly).
# Can be overridden by --source
source = ''

# Target compose for upgrade (optional).
# Can be provided in a format of <major>.<minor> (e.g. 9.4) or explicit compose name (e.g. RHEL-9.4.0-Nightly).
# If not specified, will be derived from source as <source_major + 1>.<source_minor - 6> (e.g. 8.10 -> 9.4).
# Can be overridden by --target
target = ''

# ============================================================================
# COPR_API (Copr build settings for artifacts)
# - Owner/repo/package resolution and optional build references
# - WARNING: Useless at this point, the copr rpm testing is broken
# ============================================================================
[copr_api]
# COPR repository owner (leave empty to use project.owner)
owner = ''

# Set to true if owner is a group/organization (prepends '@' to owner)
# Default: false
owner_is_group = false

# COPR repository name (leave empty to use project.name)
repository = ''

# Package name (leave empty to use project.name)
package = ''

# Default build reference for artifact testing
# Leave empty to use latest build
build_references = []


# ============================================================================
# BREW_API (Brew build settings for artifacts)
# - Build references
# - INFO:  session_url/taskid_url typically come from defaults
# ============================================================================
[brew_api]
# Default build reference for artifact testing
# Example: '1.2.3-4.el8' or task ID
build_references = []


# ============================================================================
# REPORTPORTAL (Launch and upload configuration)
# - REQUIRED:
#   - token
# - Configure name/description; can be overridden by CLI flags
# ============================================================================
[reportportal]
# ReportPortal integration configuration
# Values here will be prefixed with TMT_PLUGIN_REPORT_REPORTPORTAL_ and added as environment variables
# Example: url = 'https://my-reportportal.com' becomes TMT_PLUGIN_REPORT_REPORTPORTAL_URL = 'https://my-reportportal.com'

# API token for authentication (REQUIRED for 'enge rp' commands)
# Priority: config value > REPORTPORTAL_API_TOKEN environment variable
token = ''

# ReportPortal server url (REQUIRED - for correct functioning of the 'enge rp' commands and launch generation)
url = ''

# Project name in ReportPortal (REQUIRED - for correct functioning of the 'enge rp' commands and launch generation)
project = ''

# Override launch name (overrides default autogenerated launch name, can be overridden with --rp-launch)
launch = ''

# Override description (overrides default autogenerated launch description, can be overridden with --rp-description)
description = ''

# Log size limit for TMT ReportPortal plugin
# TMT default: '1 MB', enge hardcoded default: '10 MB'
log_size_limit = ''

# Traceback size limit for TMT ReportPortal plugin
# TMT default: '50 kB', enge hardcoded default: '500 kB'
traceback_size_limit = ''

# Maximum artifact file size for log enrichment (used by 'enge reportportal --enrich-logs')
# enge hardcoded default: '5 MB'
enrich_max_file_size = ''

# INFO: Test sets can override or add reportportal settings:
# [tests.set.my-test-set.reportportal]
# launch = 'Custom Launch Name'
# launch_description = 'Set-specific description'
