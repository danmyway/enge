# ============================================================================
# ENGE Configuration File
# ============================================================================
# This is the default configuration for enge. Copy this file to one of:
#   - ~/.config/enge.toml (recommended)
#   - ~/.enge.toml
#   - ./enge.toml (project-specific)
#
# All settings marked "REQUIRED" must be configured for enge to work.
# All other settings have sensible defaults.
# ============================================================================

[project]
# REQUIRED: Name of the project/package being tested
name = ""

# REQUIRED: Owner/organization of the project
owner = ""

# REQUIRED: Full URL to the project repository
repo_url = ""


[testing_farm]
# REQUIRED: Testing Farm API access token
# Get yours at: https://docs.testing-farm.io/Testing%20Farm/0.1/onboarding.html#_api_version_v0_1
api_key = ""

# REQUIRED: Cloud resources business unit tag for cost tracking
cloud_resources_tag = ""


[tests]
# URL to tests metadata repository (if different from project repo)
# Leave empty to use project.repo_url
git_url = ""

# Git branch to checkout test suite from
# Default: main
git_branch = "main"

# Target architectures for testing (must be a list)
# Default: ["x86_64"]
architectures = ["x86_64"]

# Maximum number of plans to run in parallel
# Default: 10
parallel_limit = 10


# List of test plans to execute
# Can be overridden via command line
# Example: plans = ["/plans/basic", "/plans/integration"]
plans = []


[copr_api]
# COPR repository owner (leave empty to use project.owner)
owner = ""

# Set to true if owner is a group/organization (prepends '@' to owner)
# Default: false
owner_is_group = false

# COPR repository name (leave empty to use project.name)
repository = ""

# Package name (leave empty to use project.name)
package = ""

# Default build reference for artifact testing
# Leave empty to use latest build
build_references = []


[brew_api]
# BREW build settings for package artifacts
session_url = ""

# Default build reference for artifact testing
# Example: "1.2.3-4.el8" or task ID
build_references = []


[reportportal]
# ReportPortal integration configuration
# Values here will be prefixed with TMT_PLUGIN_REPORT_REPORTPORTAL_ and added as environment variables
# Example: url = "https://my-reportportal.com" becomes TMT_PLUGIN_REPORT_REPORTPORTAL_URL = "https://my-reportportal.com"

# ReportPortal server url (REQUIRED for 'enge rp' commands or when the launch uploades to ReportPortal)
# url = "https://your-reportportal.company.com"

# API token for authentication (REQUIRED for 'enge rp' commands)
# token = "your-reportportal-api-token"

# Project name in ReportPortal (REQUIRED for 'enge rp' commands)
# project = "your-project-name"

# Default launch name (can be overridden with --rp-launch)
launch = ""

# Default description (can be overridden with --rp-description)
description = ""

# Note: Test sets can override or add reportportal settings:
# [tests.set.my-test-set.reportportal]
# launch = "Custom Launch Name"
# launch_description = "Set-specific description"
# additional_param = "set-specific-value"

# Use 'enge rp --auto-attribute' to automatically add attributes to existing launches
# based on their names. Expects launch names in format: event-tier-arch-source_release-target_release


[common]
# Path for temporary latest jobs file
# Default: /tmp/enge_latest_jobs
archive_tasks_latest = "/tmp/enge_latest_jobs"

# Directory for archived job files
# Default: ~/.enge/jobs_archive/
archive_tasks_default = "~/.enge/jobs_archive/"

# Directory for downloaded log files
# Default: /var/tmp/enge/logs/
logs_directory = "/var/tmp/enge/logs/"


# ============================================================================
# Example Complete Configuration:
# ============================================================================
#
# [project]
# name = "my-package"
# owner = "myorg"
# repo_url = "https://github.com/myorg/my-package"
#
# [testing_farm]
# api_key = "your-testing-farm-api-key-here"
# cloud_resources_tag = "myorg-engineering"
#
# [tests]
# git_url = ""  # Uses project.repo_url
# git_branch = "main"
# architecture = "x86_64"
# parallel_limit = 5
# composes = {
#   "rhel8" = {compose = "RHEL-8.9.0-20231101.1", distro = "rhel-8", chroot = "rhel-8-x86_64"},
#   "rhel9" = {compose = "RHEL-9.3.0-20231101.1", distro = "rhel-9", chroot = "rhel-9-x86_64"}
# }
# plans = ["/plans/basic", "/plans/integration"]
#
# [copr_api]
# owner = ""  # Uses project.owner
# owner_is_group = false
# repository = ""  # Uses project.name
# package = ""  # Uses project.name
# build_references = []
#
# ============================================================================
