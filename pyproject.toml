[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enge"
version = "2026.7.12"
description = "Testing farm API requests dispatcher."
readme = "README.md"
authors = [
    {name = "Daniel Diblik", email = "ddiblik@redhat.com"},
]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests",
    "copr",
    "koji",
    "rich",
    "lxml",
    "argcomplete",
]

[project.urls]
Homepage = "https://github.com/danmyway/enge"

[project.scripts]
enge = "enge.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"enge.utils" = ["enge_default_config.toml"]

[tool.pytest.ini_options]
# Test the working tree, never an installed copy. Without this, a bare
# `python -m pytest` on a machine that also has enge installed system-wide
# (e.g. the COPR RPM under /usr/lib/pythonX.Y/site-packages) silently imports
# that copy instead of src/, so edits appear to have no effect and the suite
# "passes" against the wrong code. CI is unaffected -- it installs editable
# into a clean runner -- so this only ever bites locally, which is exactly
# where it is hardest to notice.
pythonpath = ["src"]
testpaths = ["tests"]

[tool.black]
target-version = ["py311"]
