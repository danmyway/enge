[mypy]
python_version = 3.11
ignore_missing_imports = True
check_untyped_defs = True

# Baseline ratchet — remove entries as modules are annotated. Never add entries.
# call-arg is NEVER disabled here; those lines use inline type: ignore instead.

[mypy-enge.cancel.__main__]  # var-annotated
disable_error_code = var-annotated

[mypy-enge.dispatch.pin_compose]  # var-annotated
disable_error_code = var-annotated

[mypy-enge.dispatch.set_flow]  # arg-type (None passed for Optional-in-practice param)
disable_error_code = arg-type

[mypy-enge.dispatch.tf_send_request]  # arg-type (annotation too narrow), dict-item
disable_error_code = arg-type, dict-item

[mypy-enge.report.__main__]  # var-annotated
disable_error_code = var-annotated

[mypy-enge.report.concurrent_parser]  # arg-type, attr-defined, assignment, index, union-attr
disable_error_code = arg-type, attr-defined, assignment, index, union-attr

[mypy-enge.reportportal.operations]  # arg-type (None reaching typed params)
disable_error_code = arg-type

[mypy-enge.reportportal.utils]  # dict-item, arg-type, return-value
disable_error_code = dict-item, arg-type, return-value

[mypy-enge.rerun.__main__]  # var-annotated
disable_error_code = var-annotated

[mypy-enge.utils.arg_parser]  # assignment (optional-import pattern)
disable_error_code = assignment

[mypy-enge.utils.config_parser]  # arg-type (Traversable vs PathLike)
disable_error_code = arg-type

[mypy-enge.utils.source_target_parser]  # var-annotated
disable_error_code = var-annotated

[mypy-enge.utils.tf_artifact]  # assignment, var-annotated
disable_error_code = assignment, var-annotated
